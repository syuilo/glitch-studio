name: Release desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example 2.0.0-alpha.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout the dispatch commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare the version commit
        id: prepare
        run: node packages/glitch-studio/desktop/release.mjs prepare
      - name: Lint and typecheck
        run: pnpm lint
      - name: Test
        run: pnpm test
        env:
          CI: true
      - name: Build the Windows NSIS installer
        run: pnpm dist:desktop
      - name: Publish the verified release
        run: node packages/glitch-studio/desktop/release.mjs publish
        env:
          RELEASE_SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          RELEASE_COMMIT_SHA: ${{ steps.prepare.outputs.release_sha }}
